<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Control preview</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 24px; background: #0b0b0b; color: #ddd; font: 14px "Segoe UI", system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0 12px 0 0; }
    label { display: inline-flex; align-items: center; gap: 6px; }
    .sizes { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
    figure { margin: 0; }
    figcaption { margin-bottom: 8px; color: #999; }
    .frame { overflow: hidden; border-radius: 6px; box-shadow: 0 0 0 1px #333; background: #000; }
    iframe { border: 0; transform-origin: 0 0; display: block; }
    a { color: #d97757; }
  </style>
</head>
<body>
  <header>
    <h1>Claude Control — XENEON EDGE sizes</h1>
    <label><input type="checkbox" id="mock" checked /> Demo data</label>
    <label><input type="checkbox" id="portrait" /> Portrait sizes</label>
    <label>Scale <input type="range" id="scale" min="0.2" max="1" step="0.05" value="0.5" /> <span id="scaleValue"></span></label>
    <a href="/widget/index.html" target="_blank">Open widget alone</a>
  </header>
  <div class="sizes" id="sizes"></div>
  <script>
    // Widget sizes on the XENEON EDGE (2560x720 panel), from the iCUE widget grid.
    const LANDSCAPE = [
      ["XL", 2536, 696],
      ["L", 1688, 696],
      ["M", 840, 696],
      ["S", 840, 344],
    ];
    const container = document.getElementById("sizes");
    const controls = ["mock", "portrait", "scale"].map((id) => document.getElementById(id));

    function draw() {
      const mock = document.getElementById("mock").checked;
      const portrait = document.getElementById("portrait").checked;
      const scale = Number(document.getElementById("scale").value);
      document.getElementById("scaleValue").textContent = Math.round(scale * 100) + "%";
      container.replaceChildren();
      for (const [name, w0, h0] of LANDSCAPE) {
        const [w, h] = portrait ? [h0, w0] : [w0, h0];
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = `${name} — ${w}×${h}`;
        const frame = document.createElement("div");
        frame.className = "frame";
        frame.style.width = `${w * scale}px`;
        frame.style.height = `${h * scale}px`;
        const iframe = document.createElement("iframe");
        iframe.width = w;
        iframe.height = h;
        iframe.style.transform = `scale(${scale})`;
        iframe.src = `/widget/index.html?instance=${name}${mock ? "&mock=1" : ""}`;
        frame.append(iframe);
        figure.append(caption, frame);
        container.append(figure);
      }
    }
    for (const control of controls) control.addEventListener("input", draw);
    draw();
  </script>
</body>
</html>
